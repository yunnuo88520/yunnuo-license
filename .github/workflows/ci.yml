name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - name: Race-check authorization, storage and backup transactions
        run: go test -race ./internal/service ./internal/httpapi ./internal/store ./internal/maintenance

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - name: Check reachable Go dependency vulnerabilities
        working-directory: backend
        run: |
          echo "::notice::Security scan Go toolchain: $(go env GOVERSION)"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit production and build dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

      - name: Validate production configuration and alert firing/recovery
        env:
          YN_DOMAIN: license.example.com
          MYSQL_ROOT_PASSWORD: configuration-test-root
          MYSQL_PASSWORD: configuration-test-application
          YN_METRICS_TOKEN: configuration-test-metrics-token-32
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f deploy/compose.production.yml config --quiet
          printf '%s' "$YN_METRICS_TOKEN" > "$RUNNER_TEMP/metrics-token"
          chmod 600 "$RUNNER_TEMP/metrics-token"
          docker run --rm --user 0 --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" -v "$RUNNER_TEMP/metrics-token:/run/secrets/metrics-token:ro" prom/prometheus:v3.6.0 check config /etc/prometheus/prometheus.yml
          export YN_DEPLOY_CONFIG_DIR="$RUNNER_TEMP/yunnuo-monitor-config"
          bash deploy/configure.sh
          docker compose -f deploy/compose.production.yml run --rm --no-deps --entrypoint /bin/sh prometheus -ec 'test -f /run/secrets/metrics-token; cat /run/secrets/metrics-token >/dev/null; touch /prometheus/.write-check; rm /prometheus/.write-check'
          docker run --rm --user 0 --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v3.6.0 test rules /etc/prometheus/alerts.test.yml
          docker run --rm -e YN_DOMAIN --entrypoint caddy -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 validate --config /etc/caddy/Caddyfile --adapter caddyfile

  update-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build license server
        working-directory: backend
        run: go build -o /tmp/yunnuo-demo-server ./cmd/server
      - name: Build installation and console pages
        working-directory: frontend
        run: npm ci && npm run build
      - name: Test independent website upgrade, expiry and rollback
        run: |
          python3 examples/update-demo/test_e2e.py --license-server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-update-demo/subscription"
          python3 examples/update-demo/test_e2e.py --license-mode perpetual --license-server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-update-demo/perpetual"
          python3 examples/platform-e2e/test_install.py --server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-platform/install"
          python3 examples/platform-e2e/test_recovery_history.py --server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-platform/recovery-history"
          python3 examples/platform-e2e/test_stage1.py --server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-platform/stage1"
          python3 examples/platform-e2e/test_stage2.py --server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-platform/stage2"
          python3 examples/platform-e2e/test_stage3.py --server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-platform/stage3"
          python3 examples/platform-e2e/test_stage4.py --server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-platform/stage4"

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache-dependency-path: sdk/go/go.mod
      - name: Test Go SDK
        working-directory: sdk/go
        run: test -z "$(gofmt -l .)" && go test ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test Node.js SDK
        working-directory: sdk/node
        run: npm test && npm run check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test Java SDK
        working-directory: sdk/java
        run: mvn -B test

  frontend:
    # Keep the browser/font environment stable while ubuntu-latest migrates.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, typecheck, and build Vue frontend
        working-directory: frontend
        run: npm ci && npm run check && npm run check:sdk && npm run build
      - name: Verify CI timeout and diagnostic process handling
        run: python3 .github/scripts/test_check_command.py
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.62.0
      - name: Install Playwright
        timeout-minutes: 5
        run: python .github/scripts/check-command.py --timeout 120 --attempts 2 --log "$RUNNER_TEMP/yunnuo-ci-setup/playwright.log" "Playwright setup" python -m pip install playwright==1.62.0
      - name: Install Chromium
        timeout-minutes: 5
        run: python .github/scripts/check-command.py --timeout 120 --attempts 2 --log "$RUNNER_TEMP/yunnuo-ci-setup/chromium.log" "Chromium setup" python -m playwright install chromium
      - name: Install browser system dependencies and fonts
        timeout-minutes: 6
        run: |
          sudo "$(command -v python)" .github/scripts/check-command.py --timeout 120 --log "$RUNNER_TEMP/yunnuo-ci-setup/dependencies.log" "Browser dependency setup" "$(command -v python)" -m playwright install-deps chromium
          sudo "$(command -v python)" .github/scripts/check-command.py --timeout 120 --log "$RUNNER_TEMP/yunnuo-ci-setup/fonts.log" "CJK font setup" apt-get install -y -o Dpkg::Use-Pty=0 fonts-noto-cjk
      - name: Build the server for browser acceptance tests
        timeout-minutes: 3
        run: go -C backend build -o /tmp/yunnuo-appearance-server ./cmd/server
      - name: Test desktop and mobile appearance in a real browser
        timeout-minutes: 3
        run: |
          python .github/scripts/check-command.py "Appearance browser acceptance" python examples/platform-e2e/test_appearance.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-appearance"
      - name: Compile and run the projects downloaded from the integration guide
        timeout-minutes: 8
        run: python .github/scripts/check-command.py "Developer integration acceptance" python examples/platform-e2e/test_integration.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-integration"
      - name: Verify card detection and agent application selection in a real browser
        timeout-minutes: 4
        run: |
          python .github/scripts/check-command.py "Card application detection acceptance" python examples/platform-e2e/test_stage1.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-application-identity/user"
          python .github/scripts/check-command.py "Agent application selection acceptance" python examples/platform-e2e/test_stage3.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-application-identity/agent"
      - name: Verify unified agent accounts and one-step onboarding
        timeout-minutes: 4
        run: python .github/scripts/check-command.py "Unified agent account acceptance" python examples/platform-e2e/test_agent_accounts.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-agent-accounts"
      - name: Verify default agent tiers and administrator cost ratios
        timeout-minutes: 4
        run: python .github/scripts/check-command.py "Agent tier pricing acceptance" python examples/platform-e2e/test_agent_tiers.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-agent-tiers"
      - name: Verify authorization concurrency, operations and MFA in a real browser
        timeout-minutes: 4
        run: python .github/scripts/check-command.py "Commercial readiness acceptance" python examples/platform-e2e/test_production.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-production"
      - name: Extract native archives and run Nginx plus API-only Go deployment
        timeout-minutes: 8
        run: |
          python3 -m pip install supervisor==4.3.0
          python3 scripts/build-release.py --arch amd64 --skip-frontend-build --allow-dirty --output "$RUNNER_TEMP/yunnuo-native-bundles"
          python3 examples/platform-e2e/test_native_deployment.py --backend "$RUNNER_TEMP/yunnuo-native-bundles/yunnuo-license-v$(cat VERSION)-linux-amd64-backend.tar.gz" --frontend "$RUNNER_TEMP/yunnuo-native-bundles/yunnuo-license-v$(cat VERSION)-frontend.tar.gz" --chromium bundled --screenshots --supervisor --artifacts "$RUNNER_TEMP/yunnuo-native-deployment"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-browser-evidence
          path: ${{ runner.temp }}/yunnuo-appearance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-browser-evidence
          path: |
            ${{ runner.temp }}/yunnuo-integration
            ${{ runner.temp }}/yunnuo-application-identity
            ${{ runner.temp }}/yunnuo-agent-accounts
            ${{ runner.temp }}/yunnuo-agent-tiers
            ${{ runner.temp }}/yunnuo-production
            ${{ runner.temp }}/yunnuo-native-deployment
            ${{ runner.temp }}/yunnuo-ci-setup

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and test all-in-one image
        run: python3 .github/scripts/check-command.py "Docker image acceptance" ./docker/test-image.sh yunnuo-license:test
        env:
          YN_DOCKER_ARTIFACTS: ${{ runner.temp }}/yunnuo-mysql
      - name: Verify root Compose deployment and MySQL persistence
        run: python3 .github/scripts/check-command.py "Compose deployment acceptance" python3 examples/platform-e2e/test_compose_deployment.py --image yunnuo-license:test --artifacts "$RUNNER_TEMP/yunnuo-compose-deployment"
      - name: Scan fixable high and critical image vulnerabilities and generate SBOM
        run: |
          mkdir -p /tmp/yunnuo-image-security
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp/yunnuo-image-security:/reports aquasec/trivy:0.66.0 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format json --output /reports/vulnerabilities.json yunnuo-license:test
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp/yunnuo-image-security:/reports aquasec/trivy:0.66.0 image --format cyclonedx --output /reports/sbom.json yunnuo-license:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security-evidence
          path: |
            /tmp/yunnuo-image-security
            ${{ runner.temp }}/yunnuo-mysql
            ${{ runner.temp }}/yunnuo-compose-deployment
