name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - name: Race-check authorization, storage and backup transactions
        run: python3 ../.github/scripts/check-command.py --log "$RUNNER_TEMP/yunnuo-backend/race.log" "Backend race acceptance" go test -race ./internal/service ./internal/httpapi ./internal/store ./internal/maintenance ./internal/licensing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-race-evidence
          path: ${{ runner.temp }}/yunnuo-backend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - name: Check reachable Go dependency vulnerabilities
        working-directory: backend
        run: |
          echo "::notice::Security scan Go toolchain: $(go env GOVERSION)"
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Audit production and build dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high

      - name: Validate production configuration and alert firing/recovery
        env:
          YN_DOMAIN: license.example.com
          MYSQL_ROOT_PASSWORD: configuration-test-root
          MYSQL_PASSWORD: configuration-test-application
          YN_METRICS_TOKEN: configuration-test-metrics-token-32
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f deploy/compose.production.yml config --quiet
          printf '%s' "$YN_METRICS_TOKEN" > "$RUNNER_TEMP/metrics-token"
          chmod 600 "$RUNNER_TEMP/metrics-token"
          docker run --rm --user 0 --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" -v "$RUNNER_TEMP/metrics-token:/run/secrets/metrics-token:ro" prom/prometheus:v3.6.0 check config /etc/prometheus/prometheus.yml
          export YN_DEPLOY_CONFIG_DIR="$RUNNER_TEMP/yunnuo-monitor-config"
          bash deploy/configure.sh
          docker compose -f deploy/compose.production.yml run --rm --no-deps --entrypoint /bin/sh prometheus -ec 'test -f /run/secrets/metrics-token; cat /run/secrets/metrics-token >/dev/null; touch /prometheus/.write-check; rm /prometheus/.write-check'
          docker run --rm --user 0 --entrypoint /bin/promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v3.6.0 test rules /etc/prometheus/alerts.test.yml
          docker run --rm -e YN_DOMAIN --entrypoint caddy -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 validate --config /etc/caddy/Caddyfile --adapter caddyfile

  update-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build license server
        working-directory: backend
        run: go build -o /tmp/yunnuo-demo-server ./cmd/server
      - name: Build installation and console pages
        working-directory: frontend
        run: npm ci && npm run build
      - name: Test independent website upgrade, expiry and rollback
        run: |
          python3 examples/update-demo/test_v2.py --server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-update-demo/v2"
          python3 examples/platform-e2e/test_install.py --server /tmp/yunnuo-demo-server --artifacts "$RUNNER_TEMP/yunnuo-platform/install"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-update-and-install-evidence
          path: |
            ${{ runner.temp }}/yunnuo-update-demo
            ${{ runner.temp }}/yunnuo-platform

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - name: Test Go SDK
        working-directory: sdk/go
        run: test -z "$(gofmt -l .)" && go test ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test Node.js SDK
        working-directory: sdk/node
        run: npm test && npm run check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test Java SDK
        working-directory: sdk/java
        run: mvn -B test

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare Rust for generated language-neutral client examples
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/yunnuo-rust-target
          key: ${{ runner.os }}-v2-rust-${{ hashFiles('backend/internal/licensing/templates/Cargo.toml') }}
      - name: Compile and run the exact Go, Java, Python, Rust and TypeScript page projects
        timeout-minutes: 20
        env:
          YN_RUN_GENERATED_CLIENTS: '1'
          YN_V2_CLIENT_REPORT: ${{ runner.temp }}/yunnuo-generated-clients/report.json
          CARGO_TARGET_DIR: ${{ runner.temp }}/yunnuo-rust-target
        run: |
          mkdir -p "$RUNNER_TEMP/yunnuo-generated-clients"
          python .github/scripts/check-command.py --timeout 1140 --log "$RUNNER_TEMP/yunnuo-generated-clients/clients.log" "Five generated client acceptance" go -C backend test ./internal/httpapi -run '^TestGeneratedStandardClients$' -count=1 -timeout=19m -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-five-language-client-evidence
          path: ${{ runner.temp }}/yunnuo-generated-clients

  frontend:
    # Keep the browser/font environment stable while ubuntu-latest migrates.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, typecheck, and build Vue frontend
        working-directory: frontend
        run: npm ci && npm run check && npm run check:sdk && npm run build
      - name: Verify CI timeout and diagnostic process handling
        run: python3 .github/scripts/test_check_command.py
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.62.0
      - name: Install Playwright
        timeout-minutes: 5
        run: python .github/scripts/check-command.py --timeout 120 --attempts 2 --log "$RUNNER_TEMP/yunnuo-ci-setup/playwright.log" "Playwright setup" python -m pip install playwright==1.62.0
      - name: Install Chromium
        timeout-minutes: 5
        run: python .github/scripts/check-command.py --timeout 120 --attempts 2 --log "$RUNNER_TEMP/yunnuo-ci-setup/chromium.log" "Chromium setup" python -m playwright install chromium
      - name: Use official Ubuntu HTTPS package mirrors
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          fi
          for apt_source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' 'Acquire::Languages "none";' 'Dpkg::Use-Pty "0";' | sudo tee /etc/apt/apt.conf.d/99yunnuo-ci-network >/dev/null
      - name: Install browser system dependencies and fonts
        timeout-minutes: 6
        run: |
          sudo "$(command -v python)" .github/scripts/check-command.py --timeout 180 --log "$RUNNER_TEMP/yunnuo-ci-setup/dependencies.log" "Browser dependency setup" "$(command -v python)" -m playwright install-deps chromium
          sudo "$(command -v python)" .github/scripts/check-command.py --timeout 120 --log "$RUNNER_TEMP/yunnuo-ci-setup/fonts.log" "CJK font setup" apt-get install -y -o Dpkg::Use-Pty=0 fonts-noto-cjk xvfb python3-tk python3-pil
      - name: Build the server for browser acceptance tests
        timeout-minutes: 3
        run: go -C backend build -o /tmp/yunnuo-appearance-server ./cmd/server
      - name: Test desktop and mobile appearance in a real browser
        timeout-minutes: 3
        run: |
          python .github/scripts/check-command.py "Appearance browser acceptance" python examples/platform-e2e/test_appearance.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-appearance"
      - name: Verify current application, sales, user, agent, integration and audit pages
        timeout-minutes: 6
        run: python .github/scripts/check-command.py "V2 browser acceptance" python examples/platform-e2e/test_authorization_v2.py --server /tmp/yunnuo-appearance-server --chromium bundled --artifacts "$RUNNER_TEMP/yunnuo-v2-browser"
      - name: Run the downloaded native desktop window and retain screenshot evidence
        timeout-minutes: 4
        run: YN_TEST_PIP_PYTHON="$(command -v python)" /usr/bin/python3 examples/platform-e2e/test_v2_gui.py --server /tmp/yunnuo-appearance-server --artifacts "$RUNNER_TEMP/yunnuo-v2-gui"
      - name: Verify ordinary login, image CAPTCHA and opt-in two-factor login
        timeout-minutes: 4
        run: python .github/scripts/check-command.py "Login flow acceptance" python examples/platform-e2e/test_login.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-login"
      - name: Verify password confirmation and correct session handling in all consoles
        timeout-minutes: 4
        run: python .github/scripts/check-command.py "Password change acceptance" python examples/platform-e2e/test_password.py --server /tmp/yunnuo-appearance-server --chromium bundled --screenshots --artifacts "$RUNNER_TEMP/yunnuo-password"
      - name: Extract native archives and run Nginx plus API-only Go deployment
        timeout-minutes: 8
        run: |
          python3 -m pip install supervisor==4.3.0
          python3 scripts/build-release.py --arch amd64 --skip-frontend-build --allow-dirty --output "$RUNNER_TEMP/yunnuo-native-bundles"
          python3 examples/platform-e2e/test_native_deployment.py --backend "$RUNNER_TEMP/yunnuo-native-bundles/yunnuo-license-v$(cat VERSION)-linux-amd64-backend.tar.gz" --frontend "$RUNNER_TEMP/yunnuo-native-bundles/yunnuo-license-v$(cat VERSION)-frontend.tar.gz" --chromium bundled --screenshots --supervisor --artifacts "$RUNNER_TEMP/yunnuo-native-deployment"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-browser-evidence
          path: ${{ runner.temp }}/yunnuo-appearance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorization-browser-and-deployment-evidence
          path: |
            ${{ runner.temp }}/yunnuo-v2-browser
            ${{ runner.temp }}/yunnuo-v2-gui
            ${{ runner.temp }}/yunnuo-native-deployment
            ${{ runner.temp }}/yunnuo-ci-setup
            ${{ runner.temp }}/yunnuo-login
            ${{ runner.temp }}/yunnuo-password

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify actual Docker product upgrades and persistent installations
        timeout-minutes: 6
        run: |
          go -C backend build -o /tmp/yunnuo-scenario-server ./cmd/server
          python3 .github/scripts/check-command.py "Docker product update acceptance" python3 examples/platform-e2e/test_v2_docker.py --server /tmp/yunnuo-scenario-server --artifacts "$RUNNER_TEMP/yunnuo-docker-scenarios"
      - name: Build and test all-in-one image
        run: python3 .github/scripts/check-command.py "Docker image acceptance" ./docker/test-image.sh yunnuo-license:test
        env:
          YN_DOCKER_ARTIFACTS: ${{ runner.temp }}/yunnuo-mysql
      - name: Verify root Compose deployment and MySQL persistence
        run: python3 .github/scripts/check-command.py "Compose deployment acceptance" python3 examples/platform-e2e/test_compose_deployment.py --image yunnuo-license:test --artifacts "$RUNNER_TEMP/yunnuo-compose-deployment"
      - name: Scan fixable high and critical image vulnerabilities and generate SBOM
        run: |
          mkdir -p /tmp/yunnuo-image-security
          scan_status=0
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp/yunnuo-image-security:/reports aquasec/trivy:0.66.0 image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format json --output /reports/vulnerabilities.json yunnuo-license:test || scan_status=$?
          python3 - <<'PYREPORT'
          import json, pathlib
          report=pathlib.Path('/tmp/yunnuo-image-security/vulnerabilities.json')
          if report.exists():
              for result in json.loads(report.read_text()).get('Results', []):
                  for finding in result.get('Vulnerabilities', []):
                      print(f"{finding['Severity']} {finding['VulnerabilityID']}: {finding['PkgName']} {finding['InstalledVersion']} -> {finding.get('FixedVersion', 'unavailable')} ({result['Target']})")
          else:
              print('The scanner did not produce a report; inspect the preceding scanner diagnostics.')
          PYREPORT
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v /tmp/yunnuo-image-security:/reports aquasec/trivy:0.66.0 image --format cyclonedx --output /reports/sbom.json yunnuo-license:test
          exit "$scan_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-security-evidence
          path: |
            /tmp/yunnuo-image-security
            ${{ runner.temp }}/yunnuo-mysql
            ${{ runner.temp }}/yunnuo-compose-deployment
            ${{ runner.temp }}/yunnuo-docker-scenarios

  licensing-mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: v2-isolated-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin --protocol=tcp -h127.0.0.1 -uroot -pv2-isolated-ci-password ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.10'
          cache-dependency-path: backend/go.sum
      - name: Run complete scoped licensing and concurrency scenarios in real MySQL
        env:
          YN_V2_MYSQL_DSN: 'root:v2-isolated-ci-password@tcp(127.0.0.1:3306)/?charset=utf8mb4&multiStatements=true&parseTime=false'
        run: python3 .github/scripts/check-command.py --log "$RUNNER_TEMP/yunnuo-v2-mysql/scenarios.log" "V2 MySQL acceptance" go -C backend test ./internal/licensing -count=1 -timeout=12m -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-mysql-scenario-evidence
          path: ${{ runner.temp }}/yunnuo-v2-mysql
