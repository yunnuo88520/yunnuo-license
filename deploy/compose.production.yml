name: yunnuo-license
services:
  license:
    image: ${YN_IMAGE:-yunnuo-license:0.3.0}
    build:
      context: ..
      args:
        VCS_REF: ${YN_BUILD_COMMIT:-unknown}
        BUILD_TIME: ${YN_BUILD_TIME:-unknown}
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-yunnuo_license}
      MYSQL_USER: ${MYSQL_USER:-yunnuo}
      YN_CARD_PEPPER: ${YN_CARD_PEPPER:-}
      YN_DATA_KEY: ${YN_DATA_KEY:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set a strong root database password}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set a strong application database password}
      YN_METRICS_TOKEN: ${YN_METRICS_TOKEN:?set a random metrics token}
      YN_TRUST_PROXY_HEADERS: 'true'
      YN_TRUSTED_PROXY_CIDRS: 172.28.0.10/32
      YN_ADMIN_ALLOWED_CIDRS: ${YN_ADMIN_ALLOWED_CIDRS:-}
      YN_RELEASE_TOTAL_BYTES: ${YN_RELEASE_TOTAL_BYTES:-17179869184}
      YN_RELEASE_DEVELOPER_BYTES: ${YN_RELEASE_DEVELOPER_BYTES:-8589934592}
      YN_RELEASE_PRODUCT_BYTES: ${YN_RELEASE_PRODUCT_BYTES:-2147483648}
      YN_RELEASE_PRODUCT_VERSIONS: ${YN_RELEASE_PRODUCT_VERSIONS:-100}
      YN_RELEASE_CONCURRENT_UPLOADS: ${YN_RELEASE_CONCURRENT_UPLOADS:-2}
      YN_RELEASE_CONCURRENT_DOWNLOADS: ${YN_RELEASE_CONCURRENT_DOWNLOADS:-8}
    volumes:
      - data:/var/lib/mysql
      - ${YN_DEPLOY_CONFIG_DIR:-.}/backups:/backups
    networks: [internal]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '5'}
  https:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      YN_DOMAIN: ${YN_DOMAIN:?set the public hostname}
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - caddy-config:/config
    networks:
      internal:
        ipv4_address: 172.28.0.10
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.6.0
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=30d']
    volumes:
      - ./monitoring:/etc/prometheus:ro
      - ${YN_DEPLOY_CONFIG_DIR:-.}/secrets/metrics-token:/run/secrets/metrics-token:ro
      - ${YN_DEPLOY_CONFIG_DIR:-.}/generated/public-targets.yml:/etc/prometheus/public-targets.yml:ro
      - metrics:/prometheus
    networks: [internal]
  node:
    profiles: [monitoring]
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command: ['--path.rootfs=/host', '--collector.textfile.directory=/textfile']
    volumes: ['/:/host:ro,rslave', '${YN_DEPLOY_CONFIG_DIR:-.}/monitoring/textfile:/textfile:ro']
    networks: [internal]
  blackbox:
    profiles: [monitoring]
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    networks: [internal]
  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes: ['./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro']
    networks: [internal]
networks:
  internal:
    ipam:
      config: [{subnet: 172.28.0.0/24}]
volumes:
  data:
    name: ${YN_DATA_VOLUME:-yunnuo-license-data}
  certificates:
  caddy-config:
  metrics:
