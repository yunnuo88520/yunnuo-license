proxy_set_header Host $host;
# Replace client-provided forwarding headers. If a CDN precedes Nginx,
# configure Nginx real_ip with that CDN's exact trusted ranges first.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_request_buffering on;

# Never inherit a panel/global cache for authorization or installation APIs.
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;
