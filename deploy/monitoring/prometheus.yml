global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files: [alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: yunnuo
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ['license:8080']
  - job_name: node
    static_configs:
      - targets: ['node:9100']
  - job_name: public_https
    metrics_path: /probe
    params: {module: [http_2xx]}
    file_sd_configs:
      - files: [public-targets.yml]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
