{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{.Preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;">
<tr><td align="center" style="padding:28px 12px;">
<table role="presentation" width="620" cellpadding="0" cellspacing="0" border="0" style="width:620px;max-width:100%;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;">
  <tr><td style="padding:22px 32px;border-bottom:1px solid #eef2f7;background-color:#ffffff;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
      {{if .LogoDataURL}}<td style="padding-right:10px;"><img src="{{.LogoDataURL}}" alt="{{.SiteName}}" height="34" style="border:0;vertical-align:middle;display:block;" /></td>{{end}}
      <td style="font-size:17px;font-weight:700;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;vertical-align:middle;">{{.SiteName}}</td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:32px;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;font-size:14px;line-height:1.7;color:#334155;">
    {{template "content" .}}
  </td></tr>
  <tr><td style="padding:18px 32px;border-top:1px solid #eef2f7;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Segoe UI',sans-serif;font-size:12px;line-height:1.7;color:#94a3b8;">
    此邮件由 {{.SiteName}} 系统自动发送，请勿直接回复。<br />
    {{if .SiteURL}}{{if .SiteLinkText}}<a href="{{.SiteURL}}" style="color:#64748b;text-decoration:underline;">{{.SiteLinkText}}</a>{{end}}{{end}}
  </td></tr>
</table>
</td></tr>
</table>
</body>
</html>{{end}}
